# Manual deploy to Fly.io (Actions -> Deploy to Fly.io -> Run workflow). Pushes to main are deployed by Fly's own
# GitHub connection; this is the fallback. Needs a repository secret FLY_API_TOKEN holding a deploy token for the
# app (Fly dashboard -> twyst-discovery-chat -> Tokens, or `fly tokens create deploy -a twyst-discovery-chat`).
# Changes to the agent itself still go out with `ant apply`, not with this workflow.
name: Deploy to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it halfway.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: the server keeps open conversations in memory, so it must stay on one machine.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
