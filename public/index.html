<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twyst | אפיון ראשוני</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #6366F1;
      --purple: #A855F7;
      --magenta: #D946EF;
      --peach: #FDBA74;
      --navy: #0F172A;
      --gray: #94A3B8;
      --line: #E2E8F0;
      --bot-bg: #F1F5F9;
      --page: #F8FAFC;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Noto Sans Hebrew", system-ui, sans-serif;
      color: var(--navy);
      background: var(--page);
      display: flex;
      justify-content: center;
    }
    .chat {
      width: 100%;
      max-width: 720px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-inline: 1px solid var(--line);
    }
    .bar {
      height: 4px;
      background: linear-gradient(to left, var(--blue), var(--purple), var(--magenta), var(--peach));
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .wordmark {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--blue);
      direction: ltr;
    }
    .tagline { color: var(--gray); font-size: 13px; font-style: italic; direction: ltr; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { align-self: flex-start; background: var(--bot-bg); border-start-start-radius: 4px; }
    .user {
      align-self: flex-end;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-start-end-radius: 4px;
    }
    .note { align-self: center; color: var(--gray); font-size: 13px; text-align: center; }
    .note.ok { color: #16A34A; }
    .card {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .question { margin: 0; padding: 0; border: 0; min-width: 0; }
    .question legend { padding: 0; margin-bottom: 8px; font-weight: 600; line-height: 1.5; }
    .hint { color: var(--gray); font-size: 12px; font-weight: 400; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      color: var(--navy);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      font-weight: 500;
      line-height: 1.4;
    }
    .chip:hover:not(:disabled) { border-color: var(--blue); }
    .chip[aria-pressed="true"] { color: #fff; background: var(--blue); border-color: var(--blue); }
    .other-text {
      display: block;
      width: 100%;
      margin-top: 8px;
      font: inherit;
      color: inherit;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .other-text:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
    .card-submit { align-self: flex-end; padding: 8px 18px; }
    .card.answered .chip { opacity: .4; }
    .card.answered .chip[aria-pressed="true"] { opacity: 1; }
    .card.answered .card-submit { display: none; }
    .typing { display: inline-flex; gap: 4px; padding: 14px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--gray);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      resize: none;
      font: inherit;
      color: inherit;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      max-height: 140px;
    }
    textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
    button {
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--blue);
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      cursor: pointer;
    }
    button:disabled, textarea:disabled { opacity: .5; cursor: default; }
    .mic {
      display: grid;
      place-items: center;
      width: 44px;
      padding: 0;
      color: var(--navy);
      background: var(--bot-bg);
    }
    .mic svg { width: 20px; height: 20px; }
    .mic.recording { color: #fff; background: var(--magenta); animation: pulse 1.4s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 70, 239, .45); }
      50% { box-shadow: 0 0 0 6px rgba(217, 70, 239, 0); }
    }
    .privacy { margin: 0; padding: 0 16px 12px; color: var(--gray); font-size: 12px; }
  </style>
</head>
<body>
  <main class="chat">
    <div class="bar"></div>
    <header>
      <span class="wordmark">twyst.</span>
      <span class="tagline">Systems that drive decisions.</span>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="input" rows="1" maxlength="2000" placeholder="כתבו כאן..." aria-label="הודעה"></textarea>
      <button id="mic" class="mic" type="button" hidden aria-pressed="false" aria-label="הקלטה קולית" title="דברו, והטקסט ייכתב בתיבה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="send" type="submit">שליחה</button>
    </form>
    <p class="privacy">הסיכום נשמר כדי שנציג Twyst יוכל לחזור אליכם. אין צורך לשתף מידע רגיש.</p>
  </main>

  <script>
    // Keep in sync with the opening message quoted in agents/twyst-discovery.md.
    const GREETING = "היי, אני העוזר הדיגיטלי של Twyst. אשאל 3-5 שאלות קצרות כדי להבין איפה AI יכול לחסוך לכם הכי הרבה זמן. נתחיל: במה הארגון שלכם עוסק, ומה התפקיד שלך בו?";

    const ERRORS = {
      unknown_session: "השיחה פגה. רעננו את הדף כדי להתחיל שיחה חדשה.",
      turn_limit: "הגענו לסוף השיחה. נציג Twyst ישמח להמשיך מכאן.",
      rate_limited: "נפתחו הרבה שיחות מהרשת שלכם. נסו שוב בעוד כשעה.",
      invalid_message: "ההודעה ריקה או ארוכה מדי.",
    };
    const FALLBACK_ERROR = "משהו השתבש אצלנו. אפשר לנסות שוב בעוד רגע.";

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const micButton = document.getElementById("mic");
    const PLACEHOLDER = input.placeholder;
    const bubbles = new Map();
    let sessionId = null;
    let typing = null;
    // The question card waiting for an answer. The next message, a click or typed text, answers it.
    let activeCard = null;

    function scrollDown() { log.scrollTop = log.scrollHeight; }

    function addBubble(kind, text) {
      const el = document.createElement("div");
      el.className = `bubble ${kind}`;
      el.dir = "auto";
      el.textContent = text;
      log.insertBefore(el, typing);
      scrollDown();
      return el;
    }

    function addNote(text, ok = false) {
      const el = document.createElement("div");
      el.className = ok ? "note ok" : "note";
      el.textContent = text;
      log.insertBefore(el, typing);
      scrollDown();
    }

    function setBusy(busy) {
      input.disabled = busy;
      sendButton.disabled = busy;
      micButton.disabled = busy;
      if (busy && !typing) {
        typing = document.createElement("div");
        typing.className = "bubble bot typing";
        typing.innerHTML = "<span></span><span></span><span></span>";
        log.appendChild(typing);
        scrollDown();
      } else if (!busy && typing) {
        typing.remove();
        typing = null;
        // A focused button keeps the phone keyboard closed, so the card stays in view.
        (activeCard?.querySelector(".chip") ?? input).focus();
      }
    }

    // A card from the agent's ask_visitor tool: buttons for each question, plus "אחר" with a text field.
    // One question with a single answer is sent on the first click; otherwise the card's send button sends it.
    function addQuestionCard(questions) {
      const card = document.createElement("div");
      card.className = "card";
      const instant = questions.length === 1 && !questions[0].multi_select;
      const submit = document.createElement("button");
      submit.type = "button";
      submit.className = "card-submit";
      submit.textContent = "שליחה";

      const fields = questions.map((q) => {
        const fieldset = document.createElement("fieldset");
        fieldset.className = "question";
        const legend = document.createElement("legend");
        legend.dir = "auto";
        legend.textContent = q.question;
        if (q.multi_select) {
          const hint = document.createElement("span");
          hint.className = "hint";
          hint.textContent = " (אפשר לבחור כמה)";
          legend.append(hint);
        }
        const chips = document.createElement("div");
        chips.className = "chips";
        const other = document.createElement("input");
        other.className = "other-text";
        other.dir = "auto";
        other.maxLength = 300;
        other.placeholder = "כתבו כאן";
        other.hidden = true;
        other.setAttribute("aria-label", `${q.question}: תשובה אחרת`);
        const field = { q, chips: [], other };

        for (const label of [...q.options, "אחר"]) {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.dir = "auto";
          chip.textContent = label;
          chip.setAttribute("aria-pressed", "false");
          chip.addEventListener("click", () => pick(field, chip));
          field.chips.push(chip);
          chips.append(chip);
        }
        other.addEventListener("input", updateSubmit);
        other.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            submitCard();
          }
        });
        fieldset.append(legend, chips, other);
        card.append(fieldset);
        return field;
      });

      function pick(field, chip) {
        const otherChip = field.chips.at(-1);
        const on = !field.q.multi_select || chip.getAttribute("aria-pressed") !== "true";
        if (!field.q.multi_select) for (const c of field.chips) c.setAttribute("aria-pressed", "false");
        chip.setAttribute("aria-pressed", String(on));
        field.other.hidden = otherChip.getAttribute("aria-pressed") !== "true";
        if (chip === otherChip && on) field.other.focus();
        if (instant && chip !== otherChip) return submitCard();
        updateSubmit();
      }

      function answerOf(field) {
        const picked = field.chips.slice(0, -1).filter((c) => c.getAttribute("aria-pressed") === "true").map((c) => c.textContent);
        const other = field.other.hidden ? "" : field.other.value.trim();
        return other ? [...picked, other] : picked;
      }

      function updateSubmit() {
        submit.disabled = fields.some((f) => answerOf(f).length === 0);
      }

      function submitCard() {
        const answers = fields.map(answerOf);
        if (answers.some((a) => a.length === 0) || input.disabled) return;
        // The bubble shows the answers; the agent also gets each question, so it knows which answer is which.
        send(
          answers.map((a) => a.join(", ")).join("\n"),
          fields.map((f, i) => `${f.q.question}\n${answers[i].join(", ")}`).join("\n\n"),
        );
      }

      submit.addEventListener("click", submitCard);
      card.append(submit);
      updateSubmit();
      log.insertBefore(card, typing);
      input.placeholder = "או כתבו תשובה משלכם...";
      scrollDown();
      return card;
    }

    function closeActiveCard() {
      if (!activeCard) return;
      activeCard.classList.add("answered");
      for (const el of activeCard.querySelectorAll("button, input")) el.disabled = true;
      activeCard = null;
      input.placeholder = PLACEHOLDER;
    }

    function handleEvent(event) {
      switch (event.type) {
        case "session":
          sessionId = event.sessionId;
          break;
        case "delta": {
          const el = bubbles.get(event.id) ?? addBubble("bot", "");
          bubbles.set(event.id, el);
          el.textContent += event.text;
          scrollDown();
          break;
        }
        case "message": {
          // The buffered message is the complete text; it replaces the streamed preview.
          const el = bubbles.get(event.id) ?? addBubble("bot", "");
          bubbles.set(event.id, el);
          el.textContent = event.text;
          scrollDown();
          break;
        }
        case "question":
          activeCard = addQuestionCard(event.questions);
          break;
        case "lead_saved":
          addNote("✓ הסיכום הועבר לצוות Twyst", true);
          break;
        case "error":
          addNote(event.message);
          break;
      }
    }

    // `text` is what the bubble shows, `message` what the agent gets (they differ for a card's answers).
    async function send(text, message = text) {
      stopDictation(true);
      closeActiveCard();
      addBubble("user", text);
      setBusy(true);
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sessionId, message }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          addNote(ERRORS[body.error] ?? FALLBACK_ERROR);
          return;
        }
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          let end;
          while ((end = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, end);
            buffer = buffer.slice(end + 2);
            if (frame.startsWith("data: ")) handleEvent(JSON.parse(frame.slice(6)));
          }
        }
      } catch {
        addNote(FALLBACK_ERROR);
      } finally {
        setBusy(false);
      }
    }

    function resizeInput() {
      input.style.height = "";
      input.style.height = `${input.scrollHeight}px`;
    }

    // Voice input through the browser's own speech recognition (Chrome, Edge, Safari). Where there is none,
    // as in Firefox, the button stays hidden. The words land in the box, so the visitor checks them before sending.
    const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition;
    let recognition = null;

    function startDictation() {
      const before = input.value.trim();
      recognition = new Recognition();
      recognition.lang = "he-IL";
      recognition.interimResults = true;
      // Chrome on Android repeats earlier words in continuous mode, so there it stops after a pause.
      recognition.continuous = !/Android/i.test(navigator.userAgent);
      recognition.onresult = (e) => {
        let heard = "";
        for (let i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
        input.value = [before, heard.trim()].filter(Boolean).join(" ");
        resizeInput();
      };
      recognition.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          addNote("אין גישה למיקרופון. אפשר לאשר אותה בהגדרות הדפדפן, או פשוט לכתוב.");
        } else if (e.error === "network") {
          addNote("זיהוי הדיבור לא זמין כרגע. אפשר לכתוב.");
        }
      };
      recognition.onend = () => {
        recognition = null;
        micButton.classList.remove("recording");
        micButton.setAttribute("aria-pressed", "false");
        if (!input.disabled) input.focus();
      };
      recognition.start();
      micButton.classList.add("recording");
      micButton.setAttribute("aria-pressed", "true");
    }

    // On send the recording is dropped, so late results do not refill the cleared box.
    function stopDictation(discard = false) {
      if (!recognition) return;
      if (discard) {
        recognition.onresult = null;
        recognition.abort();
      } else {
        recognition.stop();
      }
    }

    if (Recognition) {
      micButton.hidden = false;
      micButton.addEventListener("click", () => (recognition ? stopDictation() : startDictation()));
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || input.disabled) return;
      input.value = "";
      input.style.height = "";
      send(text);
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener("input", resizeInput);

    addBubble("bot", GREETING);
    input.focus();
  </script>
</body>
</html>
